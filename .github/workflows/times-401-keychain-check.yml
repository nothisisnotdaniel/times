name: Times 401 macOS verification
on:
  push:
    branches:
      - factory-ci/401-keychain-migration

permissions:
  contents: read

jobs:
  keychain:
    name: macOS ARM64 • release suite and disposable Keychain
    runs-on: macos-15
    timeout-minutes: 45
    env:
      FACTORY_TEST_COMMIT: "3175719abbce739caa51bbe1fcec1ccd75c19f2f"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Check out the exact Times build
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "3175719abbce739caa51bbe1fcec1ccd75c19f2f"
          persist-credentials: false
      - name: Prepare the disposable Keychain test directory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FACTORY_TEST_COMMIT"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          umask 077
          mkdir -p "$HOME/Library/Keychains"
          fixture="$(mktemp -d "$HOME/Library/Keychains/times-factory-401.XXXXXXXX")"
          echo "TIMES_TEST_KEYCHAIN_ROOT=$fixture" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/times401/native" "$RUNNER_TEMP/times401/full"
      - name: Install .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Restore Times
        id: restore
        run: dotnet restore Times.slnx
      - name: Exercise native key migration with temporary test keys
        id: native
        run: >
          dotnet test tests/Times.Tests/Times.Tests.csproj -c Release --no-restore
          --filter 'FullyQualifiedName~MacKeychainMigrationTests'
          --logger 'trx;LogFileName=native.trx' --results-directory "$RUNNER_TEMP/times401/native"
      - name: Run the complete Times Release suite
        id: full
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: >
          dotnet test Times.slnx -c Release --no-restore --logger trx
          --results-directory "$RUNNER_TEMP/times401/full"
      - name: Verify the native cases and write test counts
        if: always()
        env:
          NATIVE_STATUS: ${{ steps.native.outcome }}
          FULL_STATUS: ${{ steps.full.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os
          import pathlib
          import re
          import xml.etree.ElementTree as ET

          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "times401"
          root.mkdir(exist_ok=True)
          prefix = "Times.Tests.MacKeychainMigrationTests."
          lookup_lock = "LookupGuard_UsesWriterLockAndRefusesUnsafeFiles"
          duplicate = "CreateKey_GuardedProbeSeesCommittedSecondary"
          required = [f"{lookup_lock}(kind: {kind})" for kind in ("regular", "symlink", "fifo")]
          required += [f"{duplicate}(competingInsert: {value})" for value in ("False", "True")]
          sole_reader_controls = {"DocumentedUpdate_SoleReader_PreservesAccessAndLogicalItem",
                                  "SecItemUpdate_SoleReader_PreservesAccessAndLogicalItem"}
          required.extend(sorted(sole_reader_controls))

          # Trace markers come from completed fixture assertions, independent of the builder's method names.
          issued = {"original-reader", "original-reader-retry", "overlapping-original-reader"}
          refused = {"multiple-readers", "single-read-grant", "excluded-writer", "multiple-readers-retry"}
          marker = re.compile(r"factory401-proof ([a-z-]+) updates=(\d+) creates=(\d+) deletes=(\d+) licences=(\d+)"
                              r"(?: precommit-refusals=(\d+) rollbacks=(\d+))?")
          full_suite_classes = ("Times.Tests.LicenceIssuerTests.", "Times.Tests.SigningKeyStoreTests.")
          phases = {"control-allowed", "control-denied", "denied-read", "denied-write",
                    "issue-1", "issue-2", "retry-1", "retry-2"}
          comparisons = {"control identity equal", "control access equal", "persistent reference resolves",
                         "reader access equal", "partition set equal", "authorization tags equal",
                         "prompt policy equal", "owner policy equal", "integrity policy equal",
                         "excluded reader refused", "original data retained", "fixture value equal"}
          operations = {
              "copy access", "get interaction",
              "allocate protected record", "ciphertext length", "commit database", "control update",
              "create encryption context", "CSP allocator", "database allocator", "database CSP",
              "database write permission", "disable autocommit", "encrypt final", "encrypt update",
              "find password record", "find record group", "generate IV", "get database", "get file database",
              "group key header", "identify database path", "identify owner", "identify record",
              "initialize encryption", "item database", "item record", "load stamp bridge", "lock database",
              "migration arguments", "open lookup lock", "open writer lock", "provider update", "read password",
              "read protected record", "read record stamp", "read stamp data", "stamp allocator",
              "stamp database", "stamp record", "update password", "update record data", "validate group reference",
              "validate record envelope", "validate stamp envelope", "verify writer lock",
          }

          def fixture_events(result):
              output = result.findall("./{*}Output/{*}StdOut") or result.findall("./{*}Output/{*}TextMessages/{*}Message")
              events = []
              for stream in output:
                  for line in (stream.text or "").splitlines():
                      proof = marker.fullmatch(line.strip())
                      if proof and proof[1] in issued | refused:
                          evidence = {"scenario": proof[1], "updates": int(proof[2]), "creates": int(proof[3]),
                                      "deletes": int(proof[4]), "licences": int(proof[5])}
                          if proof[6] is not None:
                              evidence.update(precommit_refusals=int(proof[6]), rollbacks=int(proof[7]))
                          events.append(evidence)
                          continue
                      description, separator, value = line.strip().rpartition(" returned ")
                      if not separator or not re.fullmatch(r"-?[0-9]{1,10}", value):
                          continue
                      phase, labelled, operation = description.partition(" | ")
                      if not labelled:
                          operation, phase = phase, None
                      code = int(value)
                      if phase is not None and phase not in phases:
                          continue
                      if operation in comparisons and code in (0, 1):
                          events.append({"phase": phase, "check": operation, "value": bool(code)})
                      elif operation in operations and -(2**31) <= code < 2**31:
                          events.append({"phase": phase, "operation": operation, "status": code})
              return events

          def policy_outcome(evidence, updates):
              """Classify one completed issuer fixture from its measured results and native setter trace."""
              scenario = evidence["scenario"]
              count = evidence["updates"]
              if (evidence["creates"] or evidence["deletes"] or count != len(updates)
                      or any(event["status"] != 0 for event in updates)):
                  return None
              if "precommit_refusals" in evidence:
                  refusals = evidence["precommit_refusals"]
                  minimum = 2 if scenario == "overlapping-original-reader" else 1
                  if (scenario in issued and evidence["licences"] == 0 and refusals >= minimum
                          and evidence["rollbacks"] == count and count <= refusals):
                      return "file-keychain-refused"
                  return None
              if scenario in issued and (count, evidence["licences"]) == (1, 2):
                  return "migrated"
              if scenario in refused and (count, evidence["licences"]) == (0, 0):
                  return "protected-refused"
              return None

          report = {"commit": os.environ["FACTORY_TEST_COMMIT"], "controller": os.environ["GITHUB_SHA"], "suites": {}}
          valid = True
          for name, status in (("native", "NATIVE_STATUS"), ("full", "FULL_STATUS")):
              files = sorted((root / name).glob("*.trx"))
              results = []
              for trx in files:
                  results.extend(ET.parse(trx).findall(".//{*}UnitTestResult"))
              counts = collections.Counter(node.get("outcome", "Unknown") for node in results)
              seen = {case: [] for case in required}
              observed_controls = set()
              classes = set()
              failures = []
              diagnostics = []
              decisions = {scenario: [] for scenario in sorted(issued | refused)}
              for node in results:
                  test_name = node.get("testName", "")
                  outcome = node.get("outcome", "Unknown")
                  case = test_name.removeprefix(prefix).replace('"', "")
                  if test_name.startswith(prefix) and case in seen:
                      seen[case].append(outcome)
                      label = case
                  else:
                      label = test_name.partition("(")[0]
                  if test_name.startswith(prefix):
                      method = case.partition("(")[0]
                      if re.fullmatch(r"[A-Za-z][A-Za-z0-9_]{0,127}", method):
                          events = fixture_events(node)
                          proofs = [event for event in events if "scenario" in event]
                          trace = [event for event in events if "scenario" not in event]
                          if (case in sole_reader_controls and outcome == "Passed" and
                                  [e["status"] for e in trace if e.get("phase") == "control-allowed" and
                                   e.get("operation") == "control update"] == [0]):
                              observed_controls.add(case)
                          if trace:
                              diagnostics.append({"test": case if case in seen else method, "events": trace})
                          for evidence in proofs:
                              scenario = evidence["scenario"]
                              updates = [e for e in trace if e.get("operation") == "provider update"]
                              disposition = policy_outcome(evidence, updates)
                              valid_case = len(proofs) == 1 and outcome == "Passed" and disposition is not None
                              decisions[scenario].append({"test": method, "outcome": outcome, "valid": valid_case,
                                                          "disposition": disposition, "provider_updates": len(updates), **evidence})
                  if outcome not in ("Passed", "NotExecuted"):
                      failures.append(label)
                  for suite in full_suite_classes:
                      if test_name.startswith(suite) and outcome == "Passed":
                          classes.add(suite)
              row = {
                  "files": len(files), "cases": len(results), "outcomes": dict(counts),
                  "step": os.environ.get(status, "missing"), "required_native": seen,
                  "failed_tests": sorted(set(failures)),
                  "sole_reader_controls": sorted(observed_controls),
                  "fixture_diagnostics": diagnostics, "product_decision": decisions,
              }
              report["suites"][name] = row
              valid &= (bool(files) and row["step"] == "success" and counts["Passed"] > 0
                        and set(counts) <= {"Passed", "NotExecuted"}
                        and all(outcomes == ["Passed"] for outcomes in seen.values())
                        and observed_controls == sole_reader_controls
                        and all(len(rows) == 1 and rows[0]["valid"] for rows in decisions.values()))
              if name == "native":
                  valid &= counts["Passed"] == len(results)
              else:
                  valid &= (len(classes) == len(full_suite_classes)
                            and len(results) > report["suites"]["native"]["cases"])

          (root / "summary.json").write_text(json.dumps(report, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              print("Tested Times commit " + report["commit"] + "\n", file=summary)
              for name, row in report["suites"].items():
                  print(f"- {name}: {row['cases']} cases, {row['outcomes']}, process {row['step']}.", file=summary)
                  for test in row["failed_tests"]:
                      print("  - Failed: " + test, file=summary)
                  for trace in row["fixture_diagnostics"]:
                      print("  - " + trace["test"], file=summary)
                      for event in trace["events"]:
                          phase = event["phase"] + " / " if event["phase"] else ""
                          if "check" in event:
                              print(f"    - {phase}{event['check']} = {str(event['value']).lower()}", file=summary)
                          else:
                              print(f"    - {phase}{event['operation']} returned {event['status']}", file=summary)
                  print("  - Product policy cases:", file=summary)
                  for scenario, entries in row["product_decision"].items():
                      if not entries:
                          print(f"    - {scenario}: missing", file=summary)
                      for entry in entries:
                          print(f"    - {scenario}: {entry['test']}, {entry['outcome']}, {entry['disposition']}, verified {entry['valid']}, "
                                f"{entry['provider_updates']} native updates, {entry['licences']} verified licences", file=summary)
              print("\n| Required native case | Targeted run | Full Release run |", file=summary)
              print("| --- | --- | --- |", file=summary)
              for case in required:
                  statuses = [", ".join(row["required_native"][case]) or "Missing" for row in report["suites"].values()]
                  print("| " + " | ".join([case, *statuses]) + " |", file=summary)
          if not valid:
              raise SystemExit("The native fixture or the full Release suite failed verification. See the job summary.")
          PY
      - name: Attach test counts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: times-401-macos-3175719abbce739caa51bbe1fcec1ccd75c19f2f
          path: ${{ runner.temp }}/times401/summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Clear the disposable test directory
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil
          chosen = os.environ.get("TIMES_TEST_KEYCHAIN_ROOT")
          if chosen:
              path = pathlib.Path(chosen)
              parent = (pathlib.Path.home() / "Library/Keychains").resolve()
              if path.resolve().parent != parent or path.is_symlink() or not path.name.startswith("times-factory-401."):
                  raise SystemExit("Unexpected fixture directory")
              if path.exists(): shutil.rmtree(path)
          PY
