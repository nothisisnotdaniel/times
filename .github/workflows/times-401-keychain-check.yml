name: Times 401 macOS verification
on:
  push:
    branches:
      - factory-ci/401-keychain-migration

permissions:
  contents: read

jobs:
  keychain:
    name: macOS ARM64 • release suite and disposable Keychain
    runs-on: macos-15
    timeout-minutes: 45
    env:
      FACTORY_TEST_COMMIT: "5c0a895ac02702b76ec03d4be236a7fc366a02cf"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Check out the exact Times build
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "5c0a895ac02702b76ec03d4be236a7fc366a02cf"
          persist-credentials: false
      - name: Prepare the disposable Keychain test directory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FACTORY_TEST_COMMIT"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          umask 077
          mkdir -p "$HOME/Library/Keychains"
          fixture="$(mktemp -d "$HOME/Library/Keychains/times-factory-401.XXXXXXXX")"
          echo "TIMES_TEST_KEYCHAIN_ROOT=$fixture" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/times401/native" "$RUNNER_TEMP/times401/full"
      - name: Install .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Restore Times
        id: restore
        run: dotnet restore Times.slnx
      - name: Exercise native key migration with temporary test keys
        id: native
        run: >
          dotnet test tests/Times.Tests/Times.Tests.csproj -c Release --no-restore
          --filter 'FullyQualifiedName~MacKeychainMigrationTests'
          --logger 'trx;LogFileName=native.trx' --results-directory "$RUNNER_TEMP/times401/native"
      - name: Run the complete Times Release suite
        id: full
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: >
          dotnet test Times.slnx -c Release --no-restore --logger trx
          --results-directory "$RUNNER_TEMP/times401/full"
      - name: Verify the native cases and write test counts
        if: always()
        env:
          NATIVE_STATUS: ${{ steps.native.outcome }}
          FULL_STATUS: ${{ steps.full.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "times401"
          root.mkdir(exist_ok=True)
          prefix = "Times.Tests.MacKeychainMigrationTests."
          original_reader = "LegacyMigration_PreservesNativeRecordAndReaders"
          write_denial = "DeniedMigration_PreservesNativeRecordAccessAndLedgerForRetry"
          lookup_lock = "LookupGuard_UsesWriterLockAndRefusesUnsafeFiles"
          duplicate = "CreateKey_GuardedProbeSeesCommittedSecondary"
          required = [
              f"{original_reader}(extraReader: {extra}, oneTimeRead: {once})"
              for extra, once in (("False", "False"), ("True", "False"), ("True", "True"))
          ]
          required += [f"{write_denial}(extraReader: {value})" for value in ("False", "True")]
          required += [f"{lookup_lock}(kind: {kind})" for kind in ("regular", "symlink", "fifo")]
          required += [f"{duplicate}(competingInsert: {value})" for value in ("False", "True")]
          full_suite_classes = ("Times.Tests.LicenceIssuerTests.", "Times.Tests.SigningKeyStoreTests.")
          report = {"commit": os.environ["FACTORY_TEST_COMMIT"], "controller": os.environ["GITHUB_SHA"], "suites": {}}
          valid = True
          for name, status in (("native", "NATIVE_STATUS"), ("full", "FULL_STATUS")):
              files = sorted((root / name).glob("*.trx"))
              results = []
              for trx in files:
                  results.extend(ET.parse(trx).findall(".//{*}UnitTestResult"))
              counts = collections.Counter(node.get("outcome", "Unknown") for node in results)
              seen = {case: [] for case in required}
              classes = set()
              failures = []
              for node in results:
                  test_name = node.get("testName", "")
                  outcome = node.get("outcome", "Unknown")
                  case = test_name.removeprefix(prefix).replace('"', "")
                  if test_name.startswith(prefix) and case in seen:
                      seen[case].append(outcome)
                      label = case
                  else:
                      label = test_name.partition("(")[0]
                  if outcome not in ("Passed", "NotExecuted"):
                      failures.append(label)
                  for suite in full_suite_classes:
                      if test_name.startswith(suite) and outcome == "Passed":
                          classes.add(suite)
              row = {
                  "files": len(files), "cases": len(results), "outcomes": dict(counts),
                  "step": os.environ.get(status, "missing"), "required_native": seen,
                  "failed_tests": sorted(set(failures)),
              }
              report["suites"][name] = row
              valid &= (bool(files) and row["step"] == "success" and counts["Passed"] > 0
                        and set(counts) <= {"Passed", "NotExecuted"}
                        and all(outcomes == ["Passed"] for outcomes in seen.values()))
              if name == "native":
                  valid &= counts["Passed"] == len(results)
              else:
                  valid &= (len(classes) == len(full_suite_classes)
                            and len(results) > report["suites"]["native"]["cases"])

          (root / "summary.json").write_text(json.dumps(report, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              print("Tested Times commit " + report["commit"] + "\n", file=summary)
              for name, row in report["suites"].items():
                  print(f"- {name}: {row['cases']} cases, {row['outcomes']}, process {row['step']}.", file=summary)
                  for test in row["failed_tests"]:
                      print("  - Failed: " + test, file=summary)
              print("\n| Required native case | Targeted run | Full Release run |", file=summary)
              print("| --- | --- | --- |", file=summary)
              for case in required:
                  statuses = [", ".join(row["required_native"][case]) or "Missing" for row in report["suites"].values()]
                  print("| " + " | ".join([case, *statuses]) + " |", file=summary)
          if not valid:
              raise SystemExit("The native fixture or the full Release suite failed verification. See the job summary.")
          PY
      - name: Attach test counts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: times-401-macos-5c0a895ac02702b76ec03d4be236a7fc366a02cf
          path: ${{ runner.temp }}/times401/summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Clear the disposable test directory
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil
          chosen = os.environ.get("TIMES_TEST_KEYCHAIN_ROOT")
          if chosen:
              path = pathlib.Path(chosen)
              parent = (pathlib.Path.home() / "Library/Keychains").resolve()
              if path.resolve().parent != parent or path.is_symlink() or not path.name.startswith("times-factory-401."):
                  raise SystemExit("Unexpected fixture directory")
              if path.exists(): shutil.rmtree(path)
          PY
