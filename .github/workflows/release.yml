# Builds, tests and packs Times as a .NET tool when a version tag vX.Y.Z is pushed,
# then attaches the .nupkg to a GitHub release for that tag.
# The tag is the only source of the release version. It reaches the shell only through
# the GITHUB_REF_NAME environment variable, never through ${{ }} inside a run: script.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # No later step needs git credentials (gh uses GH_TOKEN), so the write token is not left in .git/config.
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Check the tag where it enters, before it reaches msbuild (-p: would split on ';').
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "Tag '$GITHUB_REF_NAME' is not v plus a SemVer version" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The tests run on the normal build (no version override): some tests pin the csproj version.
      - name: Test
        run: dotnet test -c Release

      # ValidateVersion in Times.csproj fails the pack unless $VERSION is SemVer.
      - name: Pack
        run: dotnet pack src/Times -c Release -p:Version="$VERSION"

      - name: Smoke check the packed tool
        run: |
          REPO="$GITHUB_WORKSPACE"
          # Outside the repo, so its nuget.config does not apply. A throwaway nuget.config with <clear />
          # and only the local folder keeps nuget.org out: a Times package published there could
          # otherwise be installed and run here instead of ours.
          cd "$RUNNER_TEMP"
          cat > smoke-nuget.config <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$REPO/nupkg" />
            </packageSources>
          </configuration>
          XML
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet tool install --global --configfile "$RUNNER_TEMP/smoke-nuget.config" --add-source "$REPO/nupkg" --version "$VERSION" Times
          ACTUAL="$(tm --version)"
          if [ "$ACTUAL" != "Times $VERSION" ]; then
            echo "tm --version printed '$ACTUAL', expected 'Times $VERSION'" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$VERSION" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" "nupkg/Times.$VERSION.nupkg" --title "Times $VERSION" --generate-notes $PRERELEASE
