# Builds, tests and packs Times as a .NET tool, then attaches the .nupkg to a GitHub release.
# - A push to develop makes a prerelease X.Y.(Z+1)-develop.<run number>, one patch above the
#   highest release tag (.github/scripts/develop-version.sh). A push that changes only the root
#   backlog.md is skipped (paths-ignore), so it makes no prerelease.
# - A merged pull request from develop into main titled "release vX.Y.Z" makes the release vX.Y.Z
#   (and its tag) on the merge commit (.github/scripts/release-pr-version.sh). Closed-unmerged PRs,
#   PRs from other branches and fork PRs are skipped by the job's if:.
# - A pushed version tag vX.Y.Z makes the release for that tag. The tag's commit must be on main,
#   and -develop tags are refused (those are only made by develop builds).
# Refs, PR fields and the run number reach the shell only through environment variables (GITHUB_REF_NAME,
# GITHUB_REF_TYPE, GITHUB_RUN_NUMBER, GITHUB_SHA, and the Version step's env:), never through ${{ }}
# inside a run: script.
name: Release

on:
  push:
    branches:
      - "develop"
    tags:
      - "v*"
    paths-ignore:
      - "backlog.md"
  pull_request:
    types:
      - "closed"
    branches:
      - "main"

permissions:
  contents: write

jobs:
  release:
    # Every push runs; a pull_request event runs only for a merged PR from develop in this repository.
    if: github.event_name == 'push' || (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # No later step needs git credentials (gh uses GH_TOKEN), so the write token is not left in .git/config.
          persist-credentials: false
          # All history and tags: develop builds read the release tags, and release tags are
          # checked against origin/main (without it the check fails rather than passes).
          fetch-depth: 0
          # A release PR builds its merge commit; empty for pushes, which keep the pushed commit.
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version
        # PR fields are attacker-influenced text: they reach the shell only as quoted variables.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Merged release PR: re-check what the job's if: checked, then take the version from the title.
            if [ "$PR_MERGED" != "true" ]; then
              echo "Pull request is not merged; nothing to release" >&2
              exit 1
            fi
            if [ "$PR_HEAD_REF" != "develop" ]; then
              echo "Release pull requests must come from develop" >&2
              exit 1
            fi
            if [ "$PR_HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
              echo "Release pull requests must come from this repository" >&2
              exit 1
            fi
            case "$MERGE_SHA" in
              '' | *[!0-9a-f]*)
                echo "Merge commit '$MERGE_SHA' is not a lowercase hex commit id" >&2
                exit 1
                ;;
            esac
            if [ "${#MERGE_SHA}" -ne 40 ]; then
              echo "Merge commit '$MERGE_SHA' is not 40 characters long" >&2
              exit 1
            fi
            if [ "$(git rev-parse HEAD)" != "$MERGE_SHA" ]; then
              echo "Checked-out commit is not the merge commit '$MERGE_SHA'" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$MERGE_SHA" origin/main; then
              echo "Merge commit '$MERGE_SHA' is not on main" >&2
              exit 1
            fi
            if ! VERSION="$(git tag --list 'v*' | sh .github/scripts/release-pr-version.sh "$PR_TITLE")"; then
              echo "Release pull request title must be exactly 'release vX.Y.Z' for a new version" >&2
              exit 1
            fi
            TAG="v$VERSION"
            TARGET="$MERGE_SHA"
          elif [ "$GITHUB_REF_TYPE" = "branch" ]; then
            # Push to develop: one patch above the highest release tag, as a prerelease.
            VERSION="$(git tag --list 'v*' | sh .github/scripts/develop-version.sh "$GITHUB_RUN_NUMBER")"
            TAG="v$VERSION"
            TARGET="$GITHUB_SHA"
          else
            # Pushed tag: refuse develop tags and tags whose commit is not on main.
            case "$GITHUB_REF_NAME" in
              *-develop*)
                echo "Tag '$GITHUB_REF_NAME' is a develop tag; only develop builds make those" >&2
                exit 1
                ;;
            esac
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Tag '$GITHUB_REF_NAME' is not on main; release tags must be made on main" >&2
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
            TARGET="$GITHUB_SHA"
          fi
          # Check the version where it enters, before it reaches msbuild (-p: would split on ';').
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "Version '$VERSION' (ref '$GITHUB_REF_NAME') is not SemVer" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"

      # The tests run on the normal build (no version override): some tests pin the csproj version.
      - name: Test
        run: dotnet test -c Release

      # ValidateVersion in Times.csproj fails the pack unless $VERSION is SemVer.
      - name: Pack
        run: dotnet pack src/Times -c Release -p:Version="$VERSION"

      - name: Smoke check the packed tool
        run: |
          REPO="$GITHUB_WORKSPACE"
          # Outside the repo, so its nuget.config does not apply. A throwaway nuget.config with <clear />
          # and only the local folder keeps nuget.org out: a Times package published there could
          # otherwise be installed and run here instead of ours.
          cd "$RUNNER_TEMP"
          cat > smoke-nuget.config <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$REPO/nupkg" />
            </packageSources>
          </configuration>
          XML
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet tool install --global --configfile "$RUNNER_TEMP/smoke-nuget.config" --add-source "$REPO/nupkg" --version "$VERSION" Times
          ACTUAL="$(tm --version)"
          if [ "$ACTUAL" != "Times $VERSION" ]; then
            echo "tm --version printed '$ACTUAL', expected 'Times $VERSION'" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$VERSION" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$TAG" "nupkg/Times.$VERSION.nupkg" --title "Times $VERSION" --generate-notes --target "$TARGET" $PRERELEASE
